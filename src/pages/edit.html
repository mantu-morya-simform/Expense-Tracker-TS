<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/edit.css" />
  </head>
  <body>
    <section class="transactions">
      <div class="add__transactions">
        <h3 class="add__transaction__heading">
          <img
            class="add__transaction__logo"
            src="../assets/icons/add-to-svgrepo-com.svg"
            alt="add__transaction__logo"
          />
          Add New Transaction
        </h3>
        <div class="add__transactions__detail">
          <div class="add__transactions__description">
            <label for="description">Description</label>
            <input
              class="description__input"
              type="text"
              placeholder="e.g. Monthly Salary"
              required
            />
          </div>

          <div class="amt__type">
            <div class="add__transactions__amount">
              <label for="amount">Amount</label>
              <input class="amount__input" type="number" placeholder="0.00" />
            </div>

            <div class="add__transactions__type">
              <label for="type">Type</label>
              <select class="type__input" name="type" id="type">
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
              </select>
            </div>
          </div>

          <div class="add__transactions__bank__source">
            <label for="bank__source">Bank / Source</label>
            <select class="bank__input" name="bank__source" id="bank__source">
              <option value="HDFC__Bank">HDFC Bank</option>
              <option value="SBI">SBI</option>
              <option value="ICICI__Bank">ICICI Bank</option>
              <option value="AXIS__Bank">AXIS Bank</option>
              <option value="Paytm">Paytm</option>
              <option value="GPay">GPay</option>
              <option value="Cash">Cash</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="add__transactions__category">
            <label for="category">Category</label>
            <select class="category__input" name="category" id="category">
              <option value="Salary">Salary</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bill">Bill</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Investment">Investment</option>

              <option value="Other">Other</option>
            </select>
          </div>

          <div class="action__buttons">
            <button class="add__transaction__update__button">
              Update Transaction
            </button>

            <button class="add__transaction__cancel__button">Cancel</button>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="../Script/edit.ts"></script>
  </body>
</html>
